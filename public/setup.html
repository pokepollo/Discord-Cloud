<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuración inicial - Discord Cloud</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="brand">
      <div class="logo">☁</div>
      <h1>Configuración inicial</h1>
      <p>Crea la contraseña de acceso al panel</p>
    </div>
    <form id="setupForm">
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required minlength="6">
      <label for="confirm">Confirmar contraseña</label>
      <input id="confirm" type="password" placeholder="Repite la contraseña" autocomplete="new-password" required minlength="6">
      <button type="submit" class="primary full">Crear acceso y entrar</button>
      <div id="setupError" class="error"></div>
    </form>
    <p class="muted" style="margin-top:1rem;font-size:.85rem">Esta contraseña se guardará localmente de forma segura (hash) en el servidor. Podrás cambiarla más adelante editando la configuración.</p>
  </div>
<script>
document.getElementById('setupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm').value;
  const err = document.getElementById('setupError');
  err.textContent = '';
  try {
    const r = await fetch('/api/setup', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password, confirm }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Error');
    location.href = '/';
  } catch (e) { err.textContent = e.message; }
});
</script>
</body>
</html>
