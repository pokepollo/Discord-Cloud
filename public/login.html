<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso - Discord Cloud</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="brand">
      <div class="logo">☁</div>
      <h1>Discord Cloud</h1>
      <p>Accede a tu almacenamiento privado</p>
    </div>
    <form id="loginForm">
      <label for="password">Contraseña</label>
      <input id="password" type="password" placeholder="Introduce tu contraseña" autocomplete="current-password" required>
      <button type="submit" class="primary full">Entrar al panel</button>
      <div id="loginError" class="error"></div>
    </form>
  </div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('password').value;
  const err = document.getElementById('loginError');
  err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ password }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Error');
    location.href = '/';
  } catch (e) { err.textContent = e.message; }
});
</script>
</body>
</html>
